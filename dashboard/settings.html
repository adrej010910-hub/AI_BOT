<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Settings</title><style>body{font-family:system-ui;background:#0b0d12;color:#fff;max-width:760px;margin:60px auto;padding:20px}section{background:#11141b;border:1px solid #252b38;border-radius:16px;padding:24px;margin:18px 0}label{display:block;margin:15px 0 6px;color:#aab3c4}input{width:100%;padding:12px;background:#0b0d12;border:1px solid #303747;color:#fff;border-radius:9px}button{margin-top:20px;padding:12px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}</style></head><body><h1>Agent settings</h1><p style="color:#98a2b3">Configure discovery and review limits. Sending remains manual.</p><section><h2>Lead discovery</h2><label>Niche</label><input id="niche" placeholder="dentists"><label>Location</label><input id="location" placeholder="New York, NY"><label>Leads per run</label><input id="limit" type="number" value="20" min="1" max="100"><label>Maximum website score</label><input id="score" type="number" value="60" min="0" max="100"><button onclick="save()">Save settings</button><p id="saved"></p></section><script>function save(){const s={niche:niche.value,location:location.value,limit:+limit.value,maxScore:+score.value};localStorage.setItem('AI_BOT_SETTINGS',JSON.stringify(s));saved.textContent='Saved locally.'}</script></body></html>
