<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lead Finder</title><style>body{margin:0;font-family:Inter,system-ui;background:#0b0d12;color:#f5f7fb}.wrap{max-width:1100px;margin:auto;padding:40px 5vw}.card{background:#11141b;border:1px solid #252b38;border-radius:16px;padding:20px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:12px;background:#0b0d12;border:1px solid #303747;color:#fff;border-radius:9px}button{padding:12px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.lead{padding:16px 0;border-top:1px solid #242936}.score{font-weight:800}.muted{color:#98a2b3}</style></head><body><main class="wrap"><h1>AI Lead Finder</h1><p class="muted">Find public business websites that may benefit from a redesign. Every lead is reviewed before outreach.</p><section class="card"><div class="row"><input id="niche" placeholder="Niche e.g. dentists"><input id="location" placeholder="Location e.g. Miami, FL"><input id="limit" type="number" value="10" min="1" max="25"><input id="max" type="number" value="65" min="0" max="100"><button onclick="run()">Find leads</button></div><p id="state" class="muted"></p></section><section id="results"></section></main><script>const API=localStorage.getItem('AI_BOT_API')||'';async function run(){state.textContent='Searching the public web and auditing sites…';results.innerHTML='';try{const r=await fetch(API+'/api/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({niche:niche.value,location:location.value,limit:+limit.value,max_score:+max.value})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));state.textContent=`Found ${d.found} candidates; ${d.qualified} qualified leads.`;results.innerHTML=d.results.filter(x=>x.lead).map(x=>`<article class="card lead"><h3>${esc(x.lead.business_name)}</h3><div class="muted">${esc(x.lead.website)}</div><p>${esc(x.lead.audit_summary)}</p><div class="score">Redesign score: ${x.lead.score}/100</div></article>`).join('')||'<div class="card">No qualifying leads found.</div>'}catch(e){state.textContent='Search failed: '+e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
