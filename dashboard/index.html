<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Web Lead Agent</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f5f7fb}header{padding:24px 5vw;border-bottom:1px solid #222631;display:flex;justify-content:space-between}h1{margin:0;font-size:24px}.badge{padding:8px 12px;border:1px solid #2b3140;border-radius:999px;color:#9da7ba;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:32px 5vw}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.card,.lead{background:#11141b;border:1px solid #242936;border-radius:16px;padding:20px}.stat b{font-size:28px;display:block;margin-top:8px}.muted{color:#8d96a8}.audit{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:28px}.input{width:100%;padding:12px;background:#0b0d12;border:1px solid #2a3040;color:#fff;border-radius:10px}.lead{display:grid;grid-template-columns:1fr auto;gap:20px;margin-bottom:14px}.score{font-size:22px;font-weight:700}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.approve{background:#f5f7fb;color:#0b0d12}.skip{background:#202530;color:#d5dae5}.draft,.send{background:#242b39;color:#fff}.message{grid-column:1/-1;background:#0b0d12;border-radius:12px;padding:14px;color:#cbd2df;white-space:pre-wrap;line-height:1.5}.empty{text-align:center;padding:60px;color:#8d96a8}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.audit,.lead{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body><header><h1>AI Web Lead Agent</h1><span class="badge">Human approval required</span></header><main class="wrap"><section class="stats" id="stats"></section><section class="card audit"><input id="url" class="input" placeholder="Website URL"><input id="name" class="input" placeholder="Business name"><input id="email" class="input" type="email" placeholder="Business email (optional)"><button class="btn approve" onclick="audit()">Audit</button></section><p class="muted">For automated prospecting use <a href="/dashboard/discover.html" style="color:#fff">AI Lead Finder</a>.</p><h2>Leads</h2><div id="leads"><div class="empty">Loading…</div></div></main><script>const API=localStorage.getItem('AI_BOT_API')||'';async function req(p,o){const r=await fetch(API+p,o);if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{const[s,l]=await Promise.all([req('/api/dashboard'),req('/api/leads')]);stats.innerHTML=[['Total',s.total],['New',s.new],['Review',s.pending_review],['Approved',s.approved],['Sent',s.sent]].slice(0,4).map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');render(l)}catch(e){leads.innerHTML='<div class="empty">API unavailable. Check the Vercel deployment.</div>'}}function render(ls){const p=ls.filter(x=>!['skipped','sent'].includes(x.status));if(!p.length){leads.innerHTML='<div class="empty">No leads yet.</div>';return}leads.innerHTML=p.map(l=>`<article class="lead"><div><h3>${esc(l.business_name)}</h3><div class="muted">${esc(l.website)} · ${esc(l.email||'no public email')}</div><p>${esc(l.audit_summary||'No issues recorded')}</p></div><div><div class="score">${l.score}/100 redesign need</div><div class="actions"><button class="btn draft" onclick="draft(${l.id})">${l.message?'Regenerate':'Generate'} message</button><button class="btn skip" onclick="setStatus(${l.id},'skipped')">Skip</button>${l.message?`<button class="btn approve" onclick="setStatus(${l.id},'approved')">Approve</button>`:''}${l.status==='approved'?`<button class="btn send" onclick="send(${l.id})">Send email</button>`:''}</div></div>${l.message?`<div class="message">${esc(l.message)}</div>`:''}</article>`).join('')}async function audit(){const u=url.value.trim(),n=name.value.trim()||'Unknown Business',e=email.value.trim()||null;if(!u)return;try{await req('/api/audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,business_name:n,email:e})});url.value='';name.value='';email.value='';load()}catch(x){alert('Audit failed: '+x.message)}}async function draft(id){try{await req(`/api/leads/${id}/draft`,{method:'POST'});load()}catch(x){alert(x.message)}}async function setStatus(id,s){try{await req(`/api/leads/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}catch(x){alert(x.message)}}async function send(id){if(!confirm('Send this approved email now?'))return;try{await req(`/api/leads/${id}/send`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true})});load()}catch(x){alert('Send failed: '+x.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
